spring.application.name=ms-reportes
server.port=8092

# ---------- MySQL de XAMPP (usuario root sin contraseña) ----------
# La base bocado_reportes se crea sola la primera vez (createDatabaseIfNotExist=true)
spring.datasource.url=jdbc:mysql://localhost:3306/bocado_reportes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=true

# ---------- JSON ----------
spring.jackson.default-property-inclusion=non_null

# ---------- Swagger: http://localhost:8092/doc/swagger-ui.html ----------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ---------- CORS (front React + Vite) ----------
bocado.cors.origenes=http://localhost:5173,http://localhost:3000

# ---------- Datos de ejemplo al iniciar (solo si las tablas están vacías) ----------
bocado.semilla.habilitada=true

# ---------- URL de los otros microservicios (llamadas internas) ----------
bocado.servicios.auth=http://localhost:8081
bocado.servicios.clientes=http://localhost:8082
bocado.servicios.catalogo=http://localhost:8083
bocado.servicios.inventario=http://localhost:8084
bocado.servicios.pedidos=http://localhost:8085
bocado.servicios.pagos=http://localhost:8086
bocado.servicios.marketing=http://localhost:8087
bocado.servicios.rutas=http://localhost:8088
bocado.servicios.reparto=http://localhost:8089
bocado.servicios.frio=http://localhost:8090
bocado.servicios.config=http://localhost:8091
bocado.servicios.reportes=http://localhost:8092
bocado.servicios.notificaciones=http://localhost:8093
