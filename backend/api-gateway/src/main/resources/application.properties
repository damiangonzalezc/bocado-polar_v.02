spring.application.name=api-gateway
server.port=8080

# El front (React + Vite) solo necesita esta URL base:  http://localhost:8080/api/v1
bocado.cors.origenes=http://localhost:5173,http://localhost:3000

# Seguridad JWT: el token lo emite ms-auth en /api/v1/auth/login (mismo secreto que ms-auth)
# Pon false para probar con Postman sin token durante el desarrollo.
bocado.seguridad.habilitada=true
bocado.jwt.secreto=BocadoPolar-ClaveSecreta-Desarrollo-2026-CambiarEnProduccion

# ---------- Destino de cada microservicio ----------
bocado.servicios.auth=http://localhost:8081
bocado.servicios.clientes=http://localhost:8082
bocado.servicios.catalogo=http://localhost:8083
bocado.servicios.inventario=http://localhost:8084
bocado.servicios.pedidos=http://localhost:8085
bocado.servicios.pagos=http://localhost:8086
bocado.servicios.marketing=http://localhost:8087
bocado.servicios.rutas=http://localhost:8088
bocado.servicios.reparto=http://localhost:8089
bocado.servicios.frio=http://localhost:8090
bocado.servicios.config=http://localhost:8091
bocado.servicios.reportes=http://localhost:8092
bocado.servicios.notificaciones=http://localhost:8093

logging.level.org.springframework.cloud.gateway=INFO
