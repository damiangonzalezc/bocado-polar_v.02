<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BOCADO Polar: pescados y mariscos congelados con cadena de frío, trazabilidad por lote y entrega refrigerada." />
    <title>BOCADO Polar</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar el parpadeo.
      (function () {
        try {
          var t = localStorage.getItem('bocadoTheme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* sin almacenamiento: tema claro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
